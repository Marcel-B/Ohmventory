services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ohmventory
      POSTGRES_USER: ohmventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmventory"]
      interval: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8888:8080"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Ohmventory: Host=db;Database=ohmventory;Username=ohmventory;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      # Modelle laufen in LM Studio auf oi-o-mat; Ohmventory spricht nur mit der LLM-Schranke davor
      # (Port 1235, nie LM Studio direkt auf 1234). LLM_ENDPOINT aus älteren .env-Dateien wird nicht mehr gelesen.
      LlmGate__Url: ${LLM_GATE_URL:-http://192.168.2.122:1235}
      Llm__VisionModel: ${LLM_VISION_MODEL:-gemma-4-26b-a4b-it-qat-mlx}
      Llm__ChatModel: ${LLM_MODEL:-gemma-4-e4b-it-mlx}
      Llm__ContextLength: ${LLM_CONTEXT_LENGTH:-8192}
      Llm__ControlToken: ${LLM_CONTROL_TOKEN:-}
      Llm__StateFile: /data/llm-paused
      Searxng__BaseUrl: http://searxng:8080
      Labels__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - images:/data

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  images:
