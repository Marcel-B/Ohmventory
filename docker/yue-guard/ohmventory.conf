# yue-guard-Eintrag für Ohmventory.
# Nach ~/.config/yue-tools/guard.d/ohmventory.conf auf oi-o-mat kopieren und eine Variante wählen.
#
# Optional: Die LLM-Schranke hält Ohmventorys Anfragen ohnehin zurück, solange Tonwerk arbeitet.
# Der Eintrag lässt den Wächter zusätzlich das Modell entladen (MODELS) und die LLM-Funktionen anhalten.
# Ohmventory wird dabei nicht angehalten, nur seine LLM-Funktionen (Erkennung, Assistent).
# Lager, Container und Einkaufsliste bleiben benutzbar. Beide Aufrufe sind idempotent.
# Ist LLM_CONTROL_TOKEN gesetzt, zusätzlich: -H 'X-Control-Token: <token>'

# Variante A: Ohmventory läuft als Docker-Stack in einem Proxmox-Container (CT-ID anpassen).
# Der Aufruf geht über ssh, weil launchd-Prozesse wegen Local Network Privacy keine LAN-Adressen erreichen.
PAUSE='ssh proxmox "pct exec <CT-ID> -- curl -fsS -X POST http://127.0.0.1:8080/api/llm/pause"'
RESUME='ssh proxmox "pct exec <CT-ID> -- curl -fsS -X POST http://127.0.0.1:8080/api/llm/resume"'

# Variante B: Ohmventory läuft per Docker direkt auf oi-o-mat.
# PAUSE='curl -fsS -X POST http://127.0.0.1:8080/api/llm/pause'
# RESUME='curl -fsS -X POST http://127.0.0.1:8080/api/llm/resume'

# Muss zu LLM_MODEL und LLM_VISION_MODEL in der .env passen.
MODELS='gemma-4-e4b-it-mlx gemma-4-26b-a4b-it-qat-mlx'
# Das Erkennungsmodell (≈ 16 GB) passt nicht neben Tonwerk: bei jeder Tonwerk-Arbeit weichen.
PAUSE_FOR=''
