# Minimal-Konfiguration: JSON-Ausgabe aktivieren, damit das Backend die Suche nutzen kann.
use_default_settings: true

server:
  # Wird über die Umgebungsvariable SEARXNG_SECRET (aus .env) überschrieben.
  secret_key: "change-me-in-production"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
